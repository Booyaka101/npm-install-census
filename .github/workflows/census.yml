name: census

on:
  schedule:
    # Daily audit. The corpus is only refreshed on Sundays (see below) because
    # ranking thousands of scoped packages against a rate-limited API takes far
    # longer than the audit itself.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      refresh_corpus:
        description: "Rebuild the corpus before auditing"
        type: boolean
        default: false
  push:
    paths:
      - tools/**
      - .github/workflows/census.yml

permissions:
  contents: write

concurrency:
  group: census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide whether to refresh the corpus
        id: plan
        run: |
          if [ "${{ github.event.inputs.refresh_corpus }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Sync BEFORE generating. Resetting afterwards would throw away a freshly
      # rebuilt corpus and then audit the stale one.
      - name: Sync to the tip
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - name: Refresh corpus
        if: steps.plan.outputs.refresh == 'true'
        run: |
          python tools/pool.py
          python tools/rank.py

      - name: Run the census
        run: python tools/census.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Census: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            # Only this workflow writes these files, so replaying our commit on
            # top of whatever landed is safe.
            git pull --rebase origin "$GITHUB_REF_NAME"
            echo "push rejected, retrying ($attempt)"
          done
          exit 1
